
name: CinePlex TV - Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CinePlex TV APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Configure Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 4. Check project files
      - name: Check Android project structure
        run: |
          echo "Checking project files..."
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/net/cineplexbd/tv/MainActivity.kt
          echo "Project structure looks correct."

      # 5. Validate Android Manifest
      - name: Validate Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("SUCCESS: AndroidManifest.xml is valid.")
          except ET.ParseError as error:
              print(f"MANIFEST XML ERROR: {error}")
              raise
          PY

      # 6. Print manifest for debugging
      - name: Show Android Manifest
        if: failure()
        run: |
          echo "Manifest contents:"
          cat -n app/src/main/AndroidManifest.xml || true

      # 7. Build APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="development-${GITHUB_RUN_NUMBER}"
          fi

          cp "$APK" "release/CinePlexTV-${VERSION}.apk"

          echo "APK successfully generated:"
          ls -lh release/

      # 9. Upload APK as workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinePlexTV-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 10. Publish GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CinePlex TV ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
