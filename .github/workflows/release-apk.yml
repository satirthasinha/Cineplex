
name: CinePlex TV - Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CinePlex TV APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 4. Check required files
      - name: Check project structure
        run: |
          set -e

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/net/cineplexbd/tv/MainActivity.kt

          echo "Project structure verified."

      # 5. Normalize and validate Android Manifest
      - name: Fix and validate Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise FileNotFoundError("AndroidManifest.xml is missing")

          # Remove UTF-8 BOM and leading whitespace
          content = path.read_text(encoding="utf-8-sig")
          content = content.lstrip()

          # Remove an optional XML declaration if present
          if content.startswith("<?xml"):
              content = content.split("?>", 1)[1].lstrip()

          # Validate XML
          root = ET.fromstring(content)

          if root.tag != "manifest":
              raise ValueError("Invalid manifest root element")

          # Write clean XML
          path.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n' + content,
              encoding="utf-8"
          )

          # Validate the saved file again
          ET.parse(path)

          print("SUCCESS: AndroidManifest.xml validated.")
          print("Manifest root:", root.tag)
          PY

      # 6. Show manifest if validation or later steps fail
      - name: Show manifest for diagnostics
        if: failure()
        run: |
          echo "Manifest location:"
          ls -la app/src/main/

          echo "Manifest contents:"
          cat -n app/src/main/AndroidManifest.xml || true

      # 7. Build debug APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # 8. Verify generated APK
      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="development-${GITHUB_RUN_NUMBER}"
          fi

          cp "$APK" "release/CinePlexTV-${VERSION}.apk"

          echo "APK generated successfully."
          ls -lh release/

      # 9. Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinePlexTV-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 10. Publish GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CinePlex TV ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
